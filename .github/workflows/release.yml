name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: Verify Tag & Run Test Suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wireguard-tools bats shellcheck

      - name: Verify tag matches tunnelsats.json latest_version and version.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          JSON_VER=$(jq -r '.latest_version' mynode_app/tunnelsats/tunnelsats.json)
          PKG_VER="v$(jq -r '.version' version.json)"
          if [ "$TAG" != "$JSON_VER" ]; then
            echo "::error::Tag ($TAG) does not match mynode_app/tunnelsats/tunnelsats.json latest_version ($JSON_VER)"
            exit 1
          fi
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag ($TAG) does not match version.json ($PKG_VER)"
            exit 1
          fi

      - name: Run MyNode SDK linter, tests, and ShellCheck
        run: |
          python3 scripts/check_mynode_app.py
          python3 -m unittest discover -s tests -p "test_*.py" -v
          bats tests/*.bats
          shellcheck -x \
            mynode_app/tunnelsats/scripts/*.sh \
            mynode_app/tunnelsats/root_scripts/reconcile_mynode.sh \
            scripts/reconcile_mynode.sh \
            scripts/deploy_mynode.sh \
            scripts/test.sh

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tarball commit SHA and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL "$TARBALL_URL" -o "/tmp/ts-mynode-${TAG}.tar.gz"
          ARCHIVE_SHA=$(gzip -dc "/tmp/ts-mynode-${TAG}.tar.gz" | git get-tar-commit-id)
          if [ "$ARCHIVE_SHA" != "${GITHUB_SHA}" ]; then
            echo "::error::Archive commit ($ARCHIVE_SHA) does not match tested GITHUB_SHA (${GITHUB_SHA})"
            exit 1
          fi
          SHA256=$(sha256sum "/tmp/ts-mynode-${TAG}.tar.gz" | awk '{print $1}')
          cat <<EOF > /tmp/release-notes.md
          ## TunnelSats for myNode ${TAG}

          ### MyNode App SDK v2 Source Pin (\`tunnelsats.json\`)

          Update \`download_source_sha256\` in \`rootfs/standard/usr/share/mynode_apps/tunnelsats/tunnelsats.json\`:

          \`\`\`json
          "latest_version": "${TAG}",
          "download_source_sha256": "${TAG} ${SHA256}"
          \`\`\`

          - **Source Archive**: \`${TARBALL_URL}\`
          - **SHA-256**: \`${SHA256}\`
          EOF
          gh release create "$TAG" --verify-tag --target "${GITHUB_SHA}" --title "TunnelSats for myNode ${TAG}" --notes-file /tmp/release-notes.md
