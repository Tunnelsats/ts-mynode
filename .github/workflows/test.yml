name: Test

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: ["main", "feat/**", "fix/**"]

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install system dependencies (wireguard-tools, bats, shellcheck)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wireguard-tools bats shellcheck

      - name: Validate MyNode App SDK v2 package
        run: python3 scripts/check_mynode_app.py

      - name: Run Python unit & integration tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run BATS reconciler tests
        run: bats tests/*.bats

      - name: Run ShellCheck on MyNode & reconciler scripts
        run: |
          shellcheck -x \
            mynode_app/tunnelsats/scripts/*.sh \
            mynode_app/tunnelsats/root_scripts/reconcile_mynode.sh \
            scripts/reconcile_mynode.sh \
            scripts/deploy_mynode.sh \
            scripts/test.sh
